<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | SANKET DONGARE</title><link rel="stylesheet" href="style.css"></head><body><div class="site-shell"><main class="main" style="margin-left:0"><header class="topbar"><a class="brand" href="home.html">SANKET <span>DONGARE</span></a><a class="btn secondary" href="home.html">Back to Site</a></header><div class="page"><section class="section"><div class="section-head"><div class="section-kicker">PRIVATE ADMIN PAGE</div><h2>Client Database</h2><p>Local enquiries collected by this browser. Export them as an Excel-compatible CSV.</p></div><div class="admin-tools"><button class="btn primary" id="export">↓ Export CSV</button><button class="btn secondary" id="clear">Clear Local Database</button></div><div id="tableWrap" style="margin-top:25px"></div></section></div></main></div><script src="app.js"></script><script>
const key='sanket_enquiries';function load(){const data=JSON.parse(localStorage.getItem(key)||'[]'),wrap=document.getElementById('tableWrap');if(!data.length){wrap.innerHTML='<div class="card" style="text-align:center"><h2>No enquiries yet</h2><p>New submissions will appear here on this device.</p></div>';return}const cols=['id','createdAt','name','email','phone','type','budget','date','message','instagram'];let html='<div class="table-scroll"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';data.forEach(r=>html+='<tr>'+cols.map(c=>'<td>'+String(r[c]??'').replace(/[&<>\"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))+'</td>').join('')+'</tr>');wrap.innerHTML=html+'</tbody></table></div>'}document.getElementById('export').onclick=()=>{const data=JSON.parse(localStorage.getItem(key)||'[]');if(!data.length)return alert('No enquiries to export.');const cols=['id','createdAt','name','email','phone','type','budget','date','message','instagram'],esc=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=[cols.map(esc).join(','),...data.map(r=>cols.map(c=>esc(r[c])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='sanket_enquiries.csv';a.click()};document.getElementById('clear').onclick=()=>{if(confirm('Delete all locally stored enquiries?')){localStorage.removeItem(key);load()}};load();</script></body></html>
